<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Clear</title></head>
<body>
<script>
try { localStorage.clear(); } catch (e) {}
try {
    if (window.indexedDB && indexedDB.databases) {
        indexedDB.databases().then(function(dbs){ dbs.forEach(function(d){ if(d.name) indexedDB.deleteDatabase(d.name); }); }).catch(function(){});
    }
} catch (e) {}
setTimeout(function(){ location.replace('index.html'); }, 300);
</script>
</body>
</html>
